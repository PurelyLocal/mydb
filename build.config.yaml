bundles:
  public:
    include:
      - docs/home/**
      - docs/ways-of-working/**
      - docs/scrum/**
  internal:
    include: [docs/**]
  admin:
    include: [docs/**]
  stakeholder:
    include:
      - docs/home/**
      - docs/incidents/**
      - docs/problems/index.md
      - docs/okrs/**
      - docs/scrum/**
redaction_rules:
  - audience: public
    fields: [impacted_metrics, timeline]
    require_public_summary: true
  - audience: stakeholder
    fields: [timeline, channels]
  - audience: internal
    fields: []
  - audience: admin
    fields: []
