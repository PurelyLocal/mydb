apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teamdocs-admin
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: admin.docs.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: teamdocs-svc
                port: { number: 80 }
