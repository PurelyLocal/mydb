name: GitFlow Pipeline

on:
  push:
    branches:
      - develop
      - release/*
      - hotfix/*
  pull_request:
    branches:
      - develop

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r scripts/requirements.txt

      - name: Run Tests
        run: |
          source .venv/bin/activate
          make test

  build:
    name: Build and Bundle
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r scripts/requirements.txt

      - name: Build Site
        run: |
          source .venv/bin/activate
          make bundle

  deploy:
    name: Deploy to Environment
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Bundles
        run: |
          echo "Deploying bundles to environment..."
          # Add deployment commands here